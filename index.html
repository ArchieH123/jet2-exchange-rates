<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exchange Rates</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
      background: #f3f3f3;
      color: #222;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      margin-top: 0;
    }

    .rate {
      font-size: 28px;
      margin: 12px 0;
      font-weight: bold;
    }

    .updated {
      margin-top: 24px;
      font-size: 14px;
      color: #666;
    }

    .error {
      color: #b00020;
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Exchange Rates</h1>
  <p>GBP Base Currency</p>

  <div id="rates">Loading rates...</div>

  <script>
    async function loadRates() {
      const ratesDiv = document.getElementById("rates");

      try {
        const response = await fetch("https://api.frankfurter.dev/v1/latest?base=GBP&symbols=EUR,TRY,MAD");

        if (!response.ok) {
          throw new Error("Network response was not ok");
        }

        const data = await response.json();

        const eur = data.rates.EUR.toFixed(2);
        const tryRate = data.rates.TRY.toFixed(2);
        const mad = data.rates.MAD.toFixed(2);

        ratesDiv.innerHTML = `
          <div class="rate">EUR - ${eur}</div>
          <div class="rate">TRY - ${tryRate}</div>
          <div class="rate">MAD - ${mad}</div>
          <div class="updated">Updated: ${data.date}</div>
        `;
      } catch (error) {
        ratesDiv.innerHTML = `
          <div class="error">Could not load exchange rates.</div>
          <div>Please try refreshing the page.</div>
        `;
        console.error("Exchange rate load failed:", error);
      }
    }

    loadRates();
  </script>
</body>
</html>
