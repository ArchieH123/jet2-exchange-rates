<script>
async function loadRates() {
  const ratesDiv = document.getElementById("rates");

  try {
    const response = await fetch("https://open.er-api.com/v6/latest/GBP");
    const data = await response.json();

    if (data.result !== "success") {
      throw new Error("API response was not successful");
    }

    const eur = data.rates.EUR.toFixed(2);
    const tryRate = data.rates.TRY.toFixed(2);
    const mad = data.rates.MAD.toFixed(2);

    ratesDiv.innerHTML = `
      <div class="rate">EUR - ${eur}</div>
      <div class="rate">TRY - ${tryRate}</div>
      <div class="rate">MAD - ${mad}</div>
      <div class="updated">Updated: ${data.time_last_update_utc}</div>
      <div class="updated" style="font-size:12px;">
        Rates by <a href="https://www.exchangerate-api.com" target="_blank">ExchangeRate-API</a>
      </div>
    `;
  } catch (error) {
    ratesDiv.innerHTML = `
      <div class="error">Could not load exchange rates.</div>
      <div>Please try refreshing the page.</div>
    `;
    console.error(error);
  }
}

loadRates();
</script>
